{% set name = "muat" %}
{% set version = "0.1.22" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/primasanjaya/muat/archive/refs/tags/v{{ version }}.tar.gz
  # MUST be recomputed after the v0.1.22 tag is PUSHED -- GitHub generates this
  # tarball from whatever commit the tag points at. v0.1.21 shipped 0.1.20 code
  # because the tag was created one commit early; the sha matched, so nothing
  # complained. Verify the tarball contains muat/pkg_reproduce/ before filling:
  #   python -c "import urllib.request,hashlib,tarfile,io; \
  #     r=urllib.request.urlopen('https://github.com/primasanjaya/muat/archive/refs/tags/v0.1.22.tar.gz').read(); \
  #     print(hashlib.sha256(r).hexdigest()); \
  #     print(sum('pkg_reproduce' in n for n in tarfile.open(fileobj=io.BytesIO(r)).getnames()),'pkg_reproduce entries')"
  sha256: FILL_AFTER_TAG_PUSH


build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - numpy
    - pandas
    - requests
    - importlib_resources  # [py<39]
    - bedtools
    - htslib
    - natsort
    - boto3
    - openpyxl
    - scikit-learn
    - pytorch
    - pyliftover
    - bcftools
    - tqdm
    - bedops
    - swalign

test:
  imports:
    - muat

about:
  home: https://github.com/primasanjaya/muat
  license: Apache-2.0
  license_file: LICENSE
  summary: A package for Mutation Attention Tool

extra:
  recipe-maintainers:
    - primasanjaya